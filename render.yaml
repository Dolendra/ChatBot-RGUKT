services:
  - type: web
    name: chatbot-rgukt
    runtime: python
    buildCommand: >
      pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: CORS_ORIGINS
        value: "https://chatbot-rgukt.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.0"
