services:
  - type: web
    name: chatbot-rgukt
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: CORS_ORIGINS
        value: "https://chatbot-rgukt.vercel.app"
      - key: RAG_SKIP_RERANK
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.0"
